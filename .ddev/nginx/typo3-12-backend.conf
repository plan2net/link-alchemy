# TYPO3 12.4 serves its backend from public/typo3/index.php; 13.4 and later from public/index.php.
# Delete this file with 12.4 support.
location /typo3/ {
    absolute_redirect off;
    try_files $uri @typo3-backend;
}

location @typo3-backend {
    if (-f $document_root/typo3/index.php) {
        rewrite ^ /typo3/index.php last;
    }
    rewrite ^ /index.php last;
}
